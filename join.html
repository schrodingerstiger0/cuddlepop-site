<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your invite · Cuddle Pop</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FCF9F4">
<!-- /join/{code} is the universal link in every invite. It opens the web page first, on every
     device (docs/18 §3): this file only forwards to /side/{code}, the guest page with Cuddle Pop's
     promises. On GitHub Pages /join/{code} never reaches this file: 404.html is a copy of
     side/index.html and renders the promises directly. No auto-redirect into the app. -->
<script>
(function () {
  var m = location.pathname.match(/\/join\/([A-Za-z0-9]{4,12})\/?$/) ||
          location.search.match(/[?&]code=([A-Za-z0-9]{4,12})(?:&|$)/);
  location.replace(m ? '/side/' + m[1].toUpperCase() : '/side/');
})();
</script>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/side/assets/side.css">
</head>
<body>
<header class="top"><a class="wordmark" href="/">Cuddle Pop</a></header>
<main class="wrap">
  <section class="screen">
    <p class="eyebrow">One sec</p>
    <h1 class="title">Taking you to Cuddle Pop…</h1>
    <noscript>
      <p class="lede">This page needs JavaScript to open your invite. Turn it on and reload, or get the Cuddle Pop app and type the code from your link into Join.</p>
    </noscript>
  </section>
</main>
</body>
</html>
