<!-- /join/{code} is the universal link in every invite. It opens the web page first, on every
     device (docs/18 §3): this file only forwards to /side/{code}, the guest page with Cuddle Pop's
     promises. On GitHub Pages 404.html is a copy of this file, so /join/{code} and /side/{code}
     forward to /side/?code={code}. No auto-redirect into the app. -->
<script>
(function () {
  // /join/CODE and /side/CODE both land here on GitHub Pages (404.html has no rewrites):
  // the app's share text links to /side/CODE, so that path must forward with its code too.
  var m = location.pathname.match(/\/(?:join|side)\/([A-Za-z0-9]{4,12})\/?$/) ||
          location.search.match(/[?&]code=([A-Za-z0-9]{4,12})(?:&|$)/);
  // Forward to the query form: Pages serves /side/ (index.html) with a 200, and the guest page
  // reads ?code=. Forwarding to /side/CODE would land on this 404 page again, forever.
  location.replace(m ? '/side/?code=' + m[1].toUpperCase() : '/side/');
})();
</script>
